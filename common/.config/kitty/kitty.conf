#: Base kitty settings (repo-managed via stow).
#: Colors live in colors.conf — regenerated by wallust on every wallpaper
#: change, so do not put color options in this file (they would be overridden).

#: Must stay first: pulls the wallust-generated scheme.
include colors.conf

font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

window_padding_width 8
background_opacity 0.95
hide_window_decorations yes
confirm_os_window_close 0

#: Remote control lets qtile live-reload colors in open windows after a
#: wallpaper change (`kitty @ --to unix:/tmp/kitty set-colors ...`).
allow_remote_control yes
listen_on unix:/tmp/kitty
